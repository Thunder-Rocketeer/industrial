# ==============================================================================
# Render blueprint for the FastAPI backend.
#
# The frontend is deployed separately on Vercel (see vercel.json) and proxies
# /api/* to this service, so the browser only ever talks to the Vercel origin.
# That is what lets the HttpOnly session cookie work: it is set on, and sent
# back to, the same site (client/next.config.ts explains the mechanism).
#
# The service's public configuration -- hostnames, feature switches, the data
# source -- is committed in server/render.env, which the backend reads on its
# own whenever it runs on Render. Only the secrets are declared here, and
# `sync: false` means Render prompts for them rather than reading this file.
#
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: industrial-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    # Two workers is enough for the free tier's memory; each one loads the CSV
    # exports (~4 MB) into its own in-memory database at startup.
    startCommand: >-
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 2
      --bind 0.0.0.0:$PORT
      --access-logfile -
      --error-logfile -
      --timeout 60
      --graceful-timeout 30
    # Liveness only. Readiness also checks the data source, and a scheduler
    # that restarts the process on a data problem would not fix it.
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Everything else lives in server/render.env. These three never can.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # At least 32 characters; python -c "import secrets; print(secrets.token_urlsafe(64))"
      - key: SECRET_KEY
        generateValue: true
