# ==============================================================================
# Tooling configuration for the FastAPI backend.
#
# Dependencies for local development are declared in requirements.txt (pinned).
# The [project] table below mirrors the *runtime* subset of those pins for
# hosts that install from pyproject.toml (uv, Vercel's Python builder). Test
# and lint tools and the Gunicorn/uvicorn process managers are deliberately
# absent so they stay out of the bundle. Keep the two files in step when
# bumping a version.
# ==============================================================================

[project]
name = "acf-dashboard-api"
version = "0.1.0"
description = "Automobile Component Factory - production, quality and inventory API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.5",
    "psycopg-pool==3.3.1",
    "duckdb==1.5.5",
    "pytz==2026.3.post1",
    "redis==8.1.0",
    "authlib==1.8.0",
    "cryptography==50.0.1",
    "PyJWT==2.13.0",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]
exclude = [".venv", "__pycache__", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern syntax)
    "N",    # pep8-naming
    "ASYNC",# flake8-async (blocking calls in async code - spec section 23)
    "S",    # flake8-bandit (security - spec sections 57 and 65)
    "T20",  # flake8-print (no stray print(); use structured logging)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "ERA",  # commented-out code (spec section 47: no dead code)
    "RUF",  # ruff-specific rules
]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the required idiom.
    "S101",  # assert is how pytest expresses expectations.
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately contain hard-coded credentials, tokens and injection
# payloads as fixtures; bandit's secret and assert rules do not apply there.
"tests/**/*.py" = ["S105", "S106", "S107", "ARG001", "ARG002", "PLC0415", "S603"]
# Package markers re-export names for convenience.
"__init__.py" = ["F401"]
# Command-line entry points: stdout is their user interface, so `print` is the
# correct call, not a stray debugging statement.
"app/db/seed.py" = ["T201"]
"app/db/verify.py" = ["T201"]
"tools/*.py" = ["T201"]
# S105 flags any constant whose name contains "TOKEN" as a possible hardcoded
# password. In these two modules the matches are an audit action name
# ("AUTH.TOKEN_REVOKED") and a JWT `typ` claim value ("access") -- both are
# public vocabulary, and neither is a credential.
"app/security/jwt.py" = ["S105"]
"app/services/audit_service.py" = ["S105"]
# The generator draws from `random` to synthesise demo production figures.
# Nothing here is a secret, a token or a key -- S311 is about cryptographic
# suitability, which does not apply to simulated factory output. Determinism is
# in fact the requirement (spec section 30), which rules out a CSPRNG.
"app/db/generator.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Lets async test functions run without an explicit marker on every test.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "security: tests covering authentication, authorization, injection, XSS, CSRF and rate limiting",
    "integration: tests that require a live Supabase or Redis instance",
]

# ------------------------------------------------------------------------------
# Vercel (Python runtime). The FastAPI instance lives in app/main.py; declaring
# it here keeps the entrypoint explicit rather than relying on auto-detection.
# ------------------------------------------------------------------------------
[tool.vercel]
entrypoint = "app.main:app"
